name: CI Pipeline

on: push

jobs:
  project-testing:
    runs-on: self-hosted

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: setup python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: install dependencies
        run: |
          pip install -r requirements.txt

      - name: run pipeline
        env:
          YT_CAPSTONE_PROJECT: ${{ secrets.YT_CAPSTONE_PROJECT }}
        run: |
          dvc repro

      - name: Run model tests
        env:
          YT_CAPSTONE_PROJECT: ${{ secrets.YT_CAPSTONE_PROJECT }}
        run: |
          python -m unittest tests/test_model.py

      - name: Promote model to production
        if: success()
        env:
          YT_CAPSTONE_PROJECT: ${{ secrets.YT_CAPSTONE_PROJECT }}
        run: python scripts/promote_model.py

      - name: Run Flask app tests
        if: success()
        env:
          YT_CAPSTONE_PROJECT: ${{ secrets.YT_CAPSTONE_PROJECT }}
        run: python -m unittest tests/test_flask_app.py

      - name: Login to AWS ECR
        if: success()
        run: |
            aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY }}
            aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_KEY }}
            aws configure set region ${{ secrets.REGION_NAME }}
            aws ecr get-login-password --region ${{ secrets.REGION_NAME }} --endpoint-url=http://localhost:4566 | docker login --username AWS --password-stdin localhost:5100

      - name: Build Docker image
        run: |
            docker build -t ${{ secrets.ECR_REPOSITORY }}:latest .

      - name: Tag Docker image
        run: docker tag ${{ secrets.ECR_REPOSITORY }}:latest localhost:5100/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Check Docker Authentication
        run: docker info

      - name: Push Docker image to ECR
        run: |
          docker push localhost:5100/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Set Up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name flask-app-cluster --endpoint-url=http://localhost:4566

      - name: Create Kubernetes Secret
        run: |
          kubectl create secret generic capstone-secret \
            --from-literal=YT_CAPSTONE_PROJECT=${{ secrets.YT_CAPSTONE_PROJECT }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to EKS
        run: |
          kubectl apply -f deployment.yaml